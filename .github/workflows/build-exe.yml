# Compile l'exécutable Windows automatiquement.
# Lancer : onglet Actions -> "Build Windows exe" -> Run workflow (ou pousser un tag v1.0.0 pour créer une Release).
name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compiler
        working-directory: backend
        shell: cmd
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --name JumeauNumerique --add-data "..\frontend;frontend" --collect-submodules uvicorn --collect-submodules anyio --hidden-import simulate_sensors launcher.py
          echo @echo off> dist\JumeauNumerique\Lancer_avec_simulateur.bat
          echo start "" "%%~dp0JumeauNumerique.exe" --simulate>> dist\JumeauNumerique\Lancer_avec_simulateur.bat
          copy ..\frontend\guide.html dist\JumeauNumerique\GUIDE_UTILISATEUR.html
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path backend/dist/JumeauNumerique -DestinationPath JumeauNumerique-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JumeauNumerique-windows
          path: JumeauNumerique-windows.zip
      - name: Release (si tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JumeauNumerique-windows.zip
